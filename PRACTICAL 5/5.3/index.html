<!DOCTYPE html>
<html>
<head>
    <title>Nigerian States Quiz</title>

    <style>
        body{
            font-family:Arial, sans-serif;
            background:#f2f2f2;
        }

        .container{
            width:450px;
            margin:40px auto;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
            text-align:center;
        }

        h2{
            color:green;
        }

        input{
            width:90%;
            padding:10px;
            margin-top:15px;
            font-size:16px;
        }

        button{
            margin-top:15px;
            padding:10px 20px;
            background:green;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:darkgreen;
        }

        #result{
            margin-top:20px;
            font-size:18px;
            font-weight:bold;
        }

        #score{
            margin-top:10px;
            color:blue;
        }
    </style>
</head>

<body>

<div class="container">

<h2>Nigerian States and Capitals Quiz</h2>

<h3 id="question"></h3>

<input type="text" id="answer" placeholder="Enter the Capital">

<br>

<button onclick="checkAnswer()">Submit</button>
<button onclick="nextQuestion()">Next State</button>

<div id="result"></div>

<h3 id="score">Score: 0</h3>

</div>

<script>

const states=[
{state:"Kano",capital:"Kano"},
{state:"Kaduna",capital:"Kaduna"},
{state:"Lagos",capital:"Ikeja"},
{state:"Oyo",capital:"Ibadan"},
{state:"Borno",capital:"Maiduguri"},
{state:"Rivers",capital:"Port Harcourt"},
{state:"Katsina",capital:"Katsina"},
{state:"Niger",capital:"Minna"},
{state:"Sokoto",capital:"Sokoto"},
{state:"Plateau",capital:"Jos"}
];

let current=0;
let score=0;

function randomQuestion(){
current=Math.floor(Math.random()*states.length);
document.getElementById("question").innerHTML=
"What is the capital of <b>"+states[current].state+"</b>?";
document.getElementById("answer").value="";
document.getElementById("result").innerHTML="";
}

function checkAnswer(){

let user=document.getElementById("answer").value.trim().toLowerCase();

let correct=states[current].capital.toLowerCase();

if(user===correct){
score++;
document.getElementById("result").style.color="green";
document.getElementById("result").innerHTML="✔ Correct!";
}
else{
document.getElementById("result").style.color="red";
document.getElementById("result").innerHTML=
"✖ Wrong! Correct Answer: "+states[current].capital;
}

document.getElementById("score").innerHTML="Score: "+score;

}

function nextQuestion(){
randomQuestion();
}

randomQuestion();

</script>

</body>
</html>
