<!DOCTYPE html>
<html>
<head>
    <title>Real-Time Form Validation</title>

    <style>
        body{
            font-family:Arial, sans-serif;
            background:#f2f2f2;
        }

        .container{
            width:450px;
            margin:40px auto;
            background:#fff;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        h2{
            text-align:center;
            color:green;
        }

        label{
            font-weight:bold;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:5px;
            margin-bottom:5px;
            font-size:16px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        .error{
            color:red;
            font-size:14px;
            margin-bottom:10px;
        }

        button{
            width:100%;
            padding:12px;
            background:green;
            color:white;
            border:none;
            border-radius:5px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:darkgreen;
        }

        #success{
            margin-top:15px;
            text-align:center;
            color:green;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="container">

<h2>Registration Form</h2>

<label>Full Name</label>
<input type="text" id="name" onkeyup="validateName()">
<div class="error" id="nameError"></div>

<label>Email Address</label>
<input type="text" id="email" onkeyup="validateEmail()">
<div class="error" id="emailError"></div>

<label>Phone Number</label>
<input type="text" id="phone" onkeyup="validatePhone()">
<div class="error" id="phoneError"></div>

<label>Password</label>
<input type="password" id="password" onkeyup="validatePassword()">
<div class="error" id="passwordError"></div>

<button onclick="submitForm()">Register</button>

<div id="success"></div>

</div>

<script>

function validateName(){

let name=document.getElementById("name").value;

if(name.length<3){
document.getElementById("nameError").innerHTML="Name must be at least 3 characters.";
return false;
}

document.getElementById("nameError").innerHTML="";
return true;

}

function validateEmail(){

let email=document.getElementById("email").value;

if(!email.includes("@") || !email.includes(".")){
document.getElementById("emailError").innerHTML="Enter a valid email address.";
return false;
}

document.getElementById("emailError").innerHTML="";
return true;

}

function validatePhone(){

let phone=document.getElementById("phone").value;

if(phone.length!=11 || phone.charAt(0)!="0"){
document.getElementById("phoneError").innerHTML="Phone must start with 0 and contain 11 digits.";
return false;
}

document.getElementById("phoneError").innerHTML="";
return true;

}

function validatePassword(){

let password=document.getElementById("password").value;

if(password.length<8){
document.getElementById("passwordError").innerHTML="Password must be at least 8 characters.";
return false;
}

document.getElementById("passwordError").innerHTML="";
return true;

}

function submitForm(){

if(validateName() && validateEmail() && validatePhone() && validatePassword()){

document.getElementById("success").innerHTML="Registration Successful!";

}else{

document.getElementById("success").innerHTML="Please correct all errors.";

}

}

</script>

</body>
</html>
