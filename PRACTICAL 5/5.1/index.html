<!DOCTYPE html>
<html>
<head>
    <title>Grade Calculator</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f2f2f2;
        }

        .container{
            width:400px;
            margin:40px auto;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        h2{
            text-align:center;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:10px;
            margin-bottom:15px;
        }

        button{
            width:100%;
            padding:10px;
            background:green;
            color:white;
            border:none;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:darkgreen;
        }

        #result{
            margin-top:20px;
            background:#eef;
            padding:15px;
            border-radius:5px;
        }
    </style>

</head>

<body>

<div class="container">

<h2>Student Grade Calculator</h2>
<label>Student Name</label>
<input type="text" id="name">

<label>Course Title</label>
<input type="text" id="course">

<label>Student Score</label>
<input type="number" id="score">

<button onclick="calculateGrade()">Calculate Grade</button>

<div id="result"></div>

</div>

<script>

function calculateGrade(){

let course=document.getElementById("course").value;
let name=document.getElementById("name").value;
let score=parseInt(document.getElementById("score").value);

let grade="";
let gp=0;
let remark="";

if(score>=70 && score<=100){
grade="A";
gp=5;
remark="Excellent";
}

else if(score>=60){
grade="B";
gp=4;
remark="Very Good";
}

else if(score>=50){
grade="C";
gp=3;
remark="Good";
}

else if(score>=45){
grade="D";
gp=2;
remark="Fair";
}

else if(score>=40){
grade="E";
gp=1;
remark="Pass";
}

else if(score>=0){
grade="F";
gp=0;
remark="Fail SEE YOUR LECTURER";
}

else{
document.getElementById("result").innerHTML="Invalid Score";
return;
}

document.getElementById("result").innerHTML=
"<h3>Result</h3>"+
"<p><b>Name:</b> "+name+"</p>"+
"<p><b>Course:</b> "+course+"</p>"+
"<p><b>Score:</b> "+score+"</p>"+
"<p><b>Grade:</b> "+grade+"</p>"+
"<p><b>Grade Point:</b> "+gp+"</p>"+
"<p><b>Remark:</b> "+remark+"</p>";

}

</script>

</body>
</html>
